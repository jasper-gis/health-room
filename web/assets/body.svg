    </filter>
    <filter id="organ-soft" x="-.2" y="-.2" width="1.4" height="1.4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".75"/>
    </filter>
    <filter id="ground-soft" x="-.5" y="-1" width="2" height="3">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
