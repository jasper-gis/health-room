<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" fill="none" role="img" aria-labelledby="body-title body-description">
  <title id="body-title">通用人体示意</title>
  <desc id="body-description">半透明正面人体和器官示意，仅用于健康资料导航，并非个人医学影像。</desc>
  <defs>
    <linearGradient id="skin" x1="83" y1="250" x2="240" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eee2d9" stop-opacity=".2"/>
      <stop offset=".19" stop-color="#fff4e9" stop-opacity=".54"/>
      <stop offset=".43" stop-color="#ead1c4" stop-opacity=".38"/>
      <stop offset=".62" stop-color="#f3dfd0" stop-opacity=".48"/>
      <stop offset=".84" stop-color="#fff4e7" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ead5ca" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="face" cx=".38" cy=".34" r=".7">
      <stop stop-color="#f6e5d8" stop-opacity=".78"/>
      <stop offset=".66" stop-color="#ddc0b4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff1e5" stop-opacity=".64"/>
    </radialGradient>
    <radialGradient id="chest" cx=".48" cy=".42" r=".54">
      <stop stop-color="#edc4ae" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ecc3b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="organ" x1="116" y1="151" x2="193" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7c5af" stop-opacity=".86"/>
      <stop offset=".48" stop-color="#d9917d" stop-opacity=".72"/>
      <stop offset="1" stop-color="#e4b4a0" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="heart" x1="167" y1="173" x2="189" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efb59f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c77c6e" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="spine" x1="159" y1="114" x2="159" y2="349" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff5e8" stop-opacity=".6"/>
      <stop offset=".7" stop-color="#fff4e8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff4e8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-.3" y="-.1" width="1.6" height="1.2" color-interpolation-filters="sRGB">
